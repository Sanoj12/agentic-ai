[project]
name = "finanical_researcher"
version = "0.1.0"
description = "finanical_researcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.2.0"
]

[project.scripts]
finanical_researcher = "finanical_researcher.main:run"
run_crew = "finanical_researcher.main:run"
train = "finanical_researcher.main:train"
replay = "finanical_researcher.main:replay"
test = "finanical_researcher.main:test"
run_with_trigger = "finanical_researcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
