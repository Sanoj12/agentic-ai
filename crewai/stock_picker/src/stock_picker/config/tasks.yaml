finding_trending_companies:
  description: >
    find the top trending companies in the news in {company} by searching the latest news
    find new companies 
  expected_output: >
    A list of trending companies in {topic}
  agent: trading_company_finder
  output_file: output/trending_companies.json

research_trending_companies:
  description: >
    given a list of trending companies ,provide detailed analysis of each company in areport 

  expected_output: >
     a report containing detailed analysis of each comapny
  agent: finanical_researcher
  output_file: output/research_report.json

pick_best_company:
  description: >
     analyze the research findings and pick the best comapny for investment

  expected_output: >
     the chosen company and why it was chosen andthe company that were not selected and reason
  agent: finanical_researcher
  output_file: output/decision.md